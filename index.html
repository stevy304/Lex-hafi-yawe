    <script>
      (function() {
        try {
          var t = localStorage.getItem("lex-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
          }
          var l = localStorage.getItem("lex-lang");
          if (l) {
            document.documentElement.lang = l;
          }
        } catch (e) {}
      })();
    </script>
