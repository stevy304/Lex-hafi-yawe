<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Lex Hafi Yawe - Legal Social Network &amp; Digital Justice Platform</title>
    <meta name="description" content="Enterprise-grade legal social network and digital justice platform for Rwanda: connect with verified legal professionals, explore legislation, access legal aid, book consultations, and participate in legal discussions." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FBF8F1" />
    <meta property="og:title" content="Lex Hafi Yawe - Legal Social Network &amp; Digital Justice Platform" />
    <meta property="og:description" content="Enterprise-grade legal social network and digital justice platform for Rwanda: connect with verified legal professionals, explore legislation, access legal aid, book consultations, and participate in legal discussions." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem("lex-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
          }
          var l = localStorage.getItem("lex-lang");
          if (l) {
            document.documentElement.lang = l;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
